name: cron-analyze-1h
on:
  schedule:
    - cron: "0 * * * *" # every 1 hour
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Call analyze endpoint for all pairs
        run: |
          for PAIR in BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT DOGEUSDT AVAXUSDT LINKUSDT DOTUSDT; do
            echo "Analyzing $PAIR"
            curl -s -X POST "${{ secrets.APP_URL }}/api/cron/analyze?symbol=$PAIR&interval=1h" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -w "\nHTTP_STATUS:%{http_code}\n"
            sleep 2
          done
          echo "Analyze all done"
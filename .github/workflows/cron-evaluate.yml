name: cron-evaluate-1h
on:
  schedule:
    - cron: "5 * * * *" # 5 minutes after analyze
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Call evaluate endpoint for all pairs
        run: |
          for PAIR in BTCUSDT ETHUSDT SOLUSDT BNBUSDT XRPUSDT ADAUSDT DOGEUSDT AVAXUSDT LINKUSDT DOTUSDT; do
            echo "Evaluating $PAIR"
            curl -s -X POST "${{ secrets.APP_URL }}/api/cron/evaluate?symbol=$PAIR" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -w "\nHTTP_STATUS:%{http_code}\n"
            sleep 1
          done
          echo "Evaluate all done"